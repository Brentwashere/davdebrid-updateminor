# Configuration for Custom Folder Organizer Conditions
directories:
  # This directory contains all files, regardless of type.
  # Since this is not a unique condition, files may also appear in other applicable directories.
  - name: 'All'
    unique: false
    cond: {}

  # Matches typical show syntax (S01E01, ep1, etc.)
  # FIRST ensures the filename does NOT contain any supplemental keywords via negative lookahead.
  - name: 'shows'
    unique: true
    cond:
      regex: '^(?!.*\b(behind\sthe\sscenes|featurette|interview|making\sof|deleted\sscene|loopers|trailer|clip|extras|bonus|short|sample)\b).*\b([sS]?[0-9]{1,2}[eExX][0-9]{1,3}|[eE][pP]\.?\s?[0-9]{1,3})\b'
    fileTypes:
      - 'video'
      - 'subtitle'

  # Matches everything else, except files containing supplemental keywords.
  # If a file has a supplemental keyword, it fails this regex and goes un-organized (or stays in All).
  - name: 'movies'
    unique: true
    cond:
      regex: '^(?!.*\b(behind\sthe\sscenes|featurette|interview|making\sof|deleted\sscene|loopers|trailer|clip|extras|bonus|short|sample)\b).*'
    fileTypes:
      - 'video'
      - 'subtitle'
